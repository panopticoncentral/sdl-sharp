name: Release SDL3 packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested packages to NuGet.org
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yaml

  publish:
    if: github.ref == 'refs/heads/main' && inputs.publish
    needs: validate
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: managed-packages
          path: packages
      - uses: NuGet/login@v1
        id: login
        with:
          user: panopticoncentral
      - name: Publish tested packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for package in packages/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
