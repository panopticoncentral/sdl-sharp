name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Restore
        run: dotnet restore SdlSharp.slnx
      - name: Verify ImGui API coverage against the restored package
        run: python scripts/check-imgui-model-coverage.py
      - name: Build without packing
        run: dotnet build SdlSharp.slnx -c Release --no-restore -p:GeneratePackageOnBuild=false
      - name: Check out matching SDL headers
        uses: actions/checkout@v7
        with:
          repository: libsdl-org/SDL
          ref: release-3.4.18
          path: upstream-sdl
          sparse-checkout: include
          persist-credentials: false
      - name: SDL ABI, coverage, and managed regressions
        run: python scripts/test-sdl.py --headers upstream-sdl/include
      - name: ImGui regression and backend smoke tests
        run: dotnet tests/SdlSharp.ImGui.Tests/bin/Release/net10.0/SdlSharp.ImGui.Tests.dll
      - name: Pack both managed libraries
        run: |
          dotnet pack src/SdlSharp -c Release --no-build -o packages
          dotnet pack src/SdlSharp.ImGui -c Release --no-build -o packages
      - name: Test a package consumer with native dependencies
        run: python scripts/test-packages.py packages
      - name: Save tested packages for release
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: managed-packages
          path: packages/*.nupkg
          if-no-files-found: error
