name: SDL2 Continuous Integration

on:
  push:
    branches: [sdl2]
  pull_request:
    branches: [sdl2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning uses the SDL2 commit history.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SdlSharp.sln
      - run: dotnet build SdlSharp.sln -c Release --no-restore
